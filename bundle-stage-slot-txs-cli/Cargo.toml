[package]
name = "bundle-stage-slot-txs-cli"
version = "0.1.0"
edition = "2021"

[dependencies]
bincode = "1.3.3"
base64 = "0.22.1"
anchor-lang = "0.32.1"
bytemuck = { version = "1.24.0", features = ["derive", "min_const_generics"] }
clap = { version = "4.5.60", features = ["derive", "env"] }
csv = "1.4.0"
dotenvy = "0.15.7"
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
solana-account = "=3.2.0"
solana-address = { version = "=1.1.0", features = ["bytemuck"] }
solana-bn254 = "=3.1.2"
solana-clock = "=3.0.0"
solana-commitment-config = "=3.0.0"
solana-hash = "=3.1.0"
solana-instruction = "=3.0.0"
solana-keypair = "=3.1.2"
solana-pubkey = { version = "=3.0.0", default-features = false }
solana-rent = "=3.0.0"
solana-rpc-client = { path = "../rpc-client", default-features = false }
solana-rpc-client-api = { path = "../rpc-client-api" }
solana-signature = { version = "=3.3.0", default-features = false }
solana-signer = "=3.0.0"
solana-system-interface = "=2.0.0"
solana-transaction = "=3.0.2"
spl-associated-token-account-interface = "=2.0.0"
spl-memo-interface = "=2.0.0"
spl-token-2022-interface = "=2.1.0"
spl-token-interface = "=2.0.0"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
litesvm = "0.10.0"
solana-program-pack = "=3.0.0"
