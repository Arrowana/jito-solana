[package]
name = "bundle-stage-slot-txs-cli"
version = "0.1.0"
edition = "2021"

[dependencies]
bincode = "1.3.3"
bytemuck = { version = "1.24.0", features = ["derive"] }
clap = { version = "4.5.60", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
solana-account = "=3.2.0"
solana-address = { version = "=1.1.0", features = ["bytemuck"] }
solana-bn254 = "=3.1.2"
solana-clock = "=3.0.0"
solana-commitment-config = "=3.0.0"
solana-hash = "=3.1.0"
solana-instruction = "=3.0.0"
solana-keypair = "=3.0.1"
solana-pubkey = { version = "=3.0.0", default-features = false }
solana-rent = "=3.0.0"
solana-rpc-client = { path = "../rpc-client", version = "=3.1.10", default-features = false }
solana-rpc-client-api = { path = "../rpc-client-api", version = "=3.1.10" }
solana-signature = { version = "=3.1.0", default-features = false }
solana-signer = "=3.0.0"
solana-transaction = "=3.0.2"
spl-associated-token-account-interface = "=2.0.0"
spl-memo-interface = "=2.0.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
